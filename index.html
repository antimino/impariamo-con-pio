<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Impariamo con Pio</title>
<style>
:root{--ink:#3b2f63;--bg1:#fff4d6;--bg2:#d9f0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
 font-family:'Baloo 2','Nunito','Trebuchet MS','Comic Sans MS',system-ui,sans-serif;color:var(--ink);
 background:#fff4d6 linear-gradient(160deg,var(--bg1),var(--bg2));font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px 4px;min-height:78px}
header h1{margin:0;font-size:clamp(22px,4vmin,38px);flex:1;text-align:center}
.rb{width:60px;height:60px;border-radius:50%;background:#fff;box-shadow:0 5px 0 rgba(60,40,120,.18);font-size:30px;display:grid;place-items:center;flex:none}
.rb:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(60,40,120,.18)}
.stars{background:#fff;border-radius:30px;padding:0 16px;height:60px;display:flex;align-items:center;gap:6px;font-size:28px;box-shadow:0 5px 0 rgba(60,40,120,.18)}
.stars.pulse{animation:pulse .5s}
main{flex:1;min-height:0;position:relative;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.hide{display:none!important}
/* home */
.home{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:14px;min-height:0}
@media (orientation:portrait){.home{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr)}}
.card{background:var(--c);border-radius:28px;box-shadow:0 8px 0 rgba(0,0,0,.18);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:clamp(20px,3.6vmin,36px);text-shadow:0 2px 0 rgba(0,0,0,.2);position:relative}
.card .e{font-size:clamp(50px,13vmin,120px);line-height:1;text-shadow:none}
.card:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.card{animation:pop .5s backwards}
/* prompt bar */
.prompt{display:flex;align-items:center;gap:12px;background:#fff;border-radius:26px;padding:8px 14px;box-shadow:0 5px 0 rgba(60,40,120,.15);flex:none}
.prompt .pio{font-size:44px}
.prompt .t{flex:1;font-size:clamp(20px,3.6vmin,34px)}
.big{font-size:clamp(70px,28vmin,300px);line-height:1;font-weight:900}
.tiles{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.tile{background:#fff;border-radius:26px;box-shadow:0 7px 0 rgba(60,40,120,.2);min-width:min(26vw,170px);height:min(26vh,170px);padding:0 18px;display:grid;place-items:center;font-size:clamp(50px,14vmin,120px);font-weight:900;color:var(--c,#7c5cff);font-family:'Arial Rounded MT Bold','Nunito',Arial,sans-serif}
.tile.sm{min-width:0;width:min(17vw,110px);height:min(17vw,110px);font-size:clamp(30px,8vmin,64px);padding:0;border-radius:20px}
.tile:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(60,40,120,.2)}
.tile.done{outline:5px solid #51cf66}
.tile.good{background:#d3f9d8;animation:pulse .6s}
.tile.shake{animation:shake .45s}
.tile.used{opacity:.25;pointer-events:none}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.agrid .tile{min-width:0;width:100%;height:110px;font-size:60px}
.detail{flex:1;display:flex;align-items:center;justify-content:center;gap:16px;min-height:0}
.detail .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex:1}
.detail .word{font-size:clamp(30px,8vmin,70px)}
.detail .word b{color:#ff6b6b}
.pic{font-size:clamp(70px,22vmin,220px);line-height:1}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;flex:none}
.pill{background:#fff;border-radius:30px;padding:10px 22px;font-size:clamp(18px,3vmin,28px);box-shadow:0 5px 0 rgba(60,40,120,.18)}
.pill.on{background:#7c5cff;color:#fff}
/* trace */
.cv{flex:1;min-height:200px;position:relative;background:#fff;border-radius:30px;box-shadow:0 7px 0 rgba(60,40,120,.18);overflow:hidden;touch-action:none}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bar{position:absolute;left:18px;right:18px;bottom:12px;height:12px;background:#eee;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd43b,#51cf66);transition:width .15s}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;flex:none}
.strip .tile{flex:none}
/* count */
.objs{flex:1;display:flex;flex-wrap:wrap;gap:2vmin;justify-content:center;align-content:center;min-height:0}
.obj{font-size:clamp(40px,12vmin,100px);line-height:1;background:none;transition:transform .2s;position:relative}
.obj.c{transform:scale(1.15)}
.obj .n{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:#7c5cff;color:#fff;border-radius:20px;font-size:.32em;padding:0 .4em;font-family:system-ui,sans-serif}
.obj.pop{animation:pop .4s backwards}
/* syllables */
.slots{display:flex;gap:12px;justify-content:center}
.slot{width:min(24vw,160px);height:min(18vh,120px);border:5px dashed #b8a9ff;border-radius:22px;display:grid;place-items:center;font-size:clamp(34px,9vmin,72px);background:rgba(255,255,255,.6);font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-weight:900}
.slot.f{border:5px solid #51cf66;background:#fff;animation:pop .3s}
.sticker{aspect-ratio:1;background:#fff;border-radius:24px;display:grid;place-items:center;font-size:clamp(40px,10vmin,90px);box-shadow:0 5px 0 rgba(60,40,120,.15)}
.sticker.lock{filter:grayscale(1) brightness(0) opacity(.12)}
.overlay{position:fixed;inset:0;background:rgba(60,40,120,.55);display:grid;place-items:center;z-index:60;animation:fade .25s}
.box{background:#fff;border-radius:34px;padding:28px 36px;text-align:center;max-width:90vw;box-shadow:0 10px 0 rgba(0,0,0,.2);animation:pop .4s}
.box input{font:inherit;font-size:30px;padding:10px 16px;border-radius:18px;border:3px solid #b8a9ff;width:min(70vw,360px);text-align:center;-webkit-user-select:text;user-select:text}
.box .big2{font-size:min(30vmin,200px)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
.confetti i{position:absolute;top:-8%;font-style:normal;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
/* colora */
.paint{flex:1;display:flex;gap:12px;min-height:0}
.art{flex:1;background:#fff;border-radius:30px;box-shadow:0 7px 0 rgba(60,40,120,.18);display:grid;place-items:center;min-height:0;min-width:0;padding:10px}
.art svg{width:100%;height:100%;fill:#fff;stroke:#111;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;touch-action:manipulation}
.art svg .c{cursor:pointer;transition:fill .15s}
.art svg .k{fill:#111;pointer-events:none}
.art svg [fill=none]{pointer-events:none}
.pal{display:grid;grid-template-columns:repeat(2,64px);gap:12px;align-content:center}
.sw{width:64px;height:64px;border-radius:50%;background:var(--c);border:5px solid #fff;box-shadow:0 4px 0 rgba(60,40,120,.25);font-size:28px;display:grid;place-items:center}
.sw.on{outline:6px solid #7c5cff;transform:scale(1.08)}
@media (orientation:portrait){.paint{flex-direction:column}.pal{grid-template-columns:repeat(6,1fr);justify-items:center}.sw{width:min(13vw,64px);height:min(13vw,64px)}}
/* vocali */
.scatter{flex:1;position:relative;background:rgba(255,255,255,.6);border-radius:30px;min-height:0;box-shadow:inset 0 0 0 4px #fff}
.sc{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));background:none;font-family:'Arial Rounded MT Bold','Nunito',Arial,sans-serif;font-weight:900;--s:clamp(46px,min(13vh,9vw),110px);font-size:var(--s);line-height:1;padding:6px 12px;border-radius:50%}
.sc.ok{background:#d3f9d8;box-shadow:0 0 0 4px #51cf66;animation:wob .5s}
.sc.shake{animation:wob2 .45s}
@keyframes wob{50%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.35)}}
@keyframes wob2{20%,60%{transform:translate(-50%,-50%) rotate(var(--r)) translateX(-10px)}40%,80%{transform:translate(-50%,-50%) rotate(var(--r)) translateX(10px)}}
.vrow{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;min-height:0}
@media (orientation:portrait){.vrow{grid-template-columns:repeat(2,1fr)}}
.rv{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:min(80vw,520px)}
.rl{font-size:min(26vmin,190px);line-height:1;font-weight:900;font-family:'Arial Rounded MT Bold','Nunito',Arial,sans-serif;animation:bounce 1.2s infinite}
.rm{font-size:min(14vmin,90px);line-height:1}
.rt{font-size:clamp(22px,4.4vmin,40px);line-height:1.25;min-height:2.6em}
.rt div{animation:fade .6s backwards}
@keyframes bounce{50%{transform:translateY(-12px) rotate(-3deg)}}
/* percorso */
#mbar{display:flex;gap:8px;justify-content:center;padding:0 16px 2px;flex-wrap:wrap}
.ms{background:#fff;border-radius:22px;padding:4px 12px;font-size:24px;opacity:.55;display:flex;gap:4px;align-items:center}
.ms small{font-size:15px;font-family:system-ui,sans-serif}
.ms.on{opacity:1;outline:4px solid #7c5cff}
.ms.ok{opacity:1;background:#d3f9d8}
.path{display:flex;gap:10px;overflow-x:auto;padding:40px 6px 8px;flex:none}
.nd{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:0 5px 0 rgba(60,40,120,.18);display:grid;place-items:center;font-size:24px;position:relative}
.nd.done{background:#ffe066}
.nd.cur{background:#7c5cff;color:#fff;animation:pulse 1.4s infinite}
.nd.cur::before{content:'🐥';position:absolute;top:-38px;font-size:30px}
.mcard{flex:1;background:#fff;border-radius:34px;box-shadow:0 8px 0 rgba(60,40,120,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.mcard h2{margin:0;font-size:clamp(26px,5.5vmin,52px)}
.stops{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.stp{display:flex;flex-direction:column;align-items:center;font-size:clamp(14px,2.4vmin,22px);gap:2px}
.stp b{font-size:clamp(34px,8vmin,64px);font-weight:400;background:#f1ecff;border-radius:50%;width:1.6em;height:1.6em;display:grid;place-items:center}
.bigbtn{font-size:clamp(28px,6vmin,48px);padding:12px 44px;background:#51cf66;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<div id="app">
 <header>
  <button class="rb" id="bHome" aria-label="Home">🏠</button>
  <h1 id="title"></h1>
  <button class="rb" id="bCase" aria-label="Maiuscolo o minuscolo" style="font-size:24px"></button>
  <button class="rb" id="bMute" aria-label="Audio"></button>
  <button class="stars" id="bStars"><span>⭐</span><span id="nStars">0</span></button>
 </header>
 <div id="mbar" class="hide"></div>
 <main id="main"></main>
</div>
<script src="disegni.js"></script>
<script>
'use strict';
const $=(s,e=document)=>e.querySelector(s);
const FONT="'Arial Rounded MT Bold','Nunito','Baloo 2',Arial,sans-serif";
const store={get(k,d){try{const v=localStorage.getItem('pio_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('pio_'+k,JSON.stringify(v))}catch(e){}}};
const S={name:store.get('name',''),stars:store.get('stars',0),lower:store.get('lower',false),mute:store.get('mute',false),done:store.get('done',{}),plan:store.get('plan',{day:1,last:'',streak:0})};
const save=()=>['name','stars','lower','mute','done','plan'].forEach(k=>store.set(k,S[k]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- dati ---------- */
const LETTERS=[['A','Ape','🐝'],['B','Barca','⛵'],['C','Casa','🏠'],['D','Dado','🎲'],['E','Elefante','🐘'],['F','Fiore','🌸'],['G','Gatto','🐱'],['H','Hotel','🏨'],['I','Isola','🏝️'],['L','Luna','🌙'],['M','Mela','🍎'],['N','Nave','🚢'],['O','Orso','🐻'],['P','Pesce','🐟'],['Q','Quadro','🖼️'],['R','Rana','🐸'],['S','Sole','☀️'],['T','Torta','🎂'],['U','Uva','🍇'],['V','Volpe','🦊'],['Z','Zebra','🦓']];
const LNAME={A:'a',B:'bi',C:'ci',D:'di',E:'e',F:'effe',G:'gi',H:'acca',I:'i',L:'elle',M:'emme',N:'enne',O:'o',P:'pi',Q:'cu',R:'erre',S:'esse',T:'ti',U:'u',V:'vu',Z:'zeta'};
const NUMW=['zero','uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci'];
const WORDS=[['CASA',['CA','SA'],'🏠'],['LUNA',['LU','NA'],'🌙'],['MELA',['ME','LA'],'🍎'],['SOLE',['SO','LE'],'☀️'],['RANA',['RA','NA'],'🐸'],['PERA',['PE','RA'],'🍐'],['UVA',['U','VA'],'🍇'],['PANE',['PA','NE'],'🍞'],['MANO',['MA','NO'],'✋'],['LUPO',['LU','PO'],'🐺'],['CANE',['CA','NE'],'🐶'],['NASO',['NA','SO'],'👃'],['DITO',['DI','TO'],'☝️'],['TOPO',['TO','PO'],'🐭'],['NAVE',['NA','VE'],'🚢'],['DADO',['DA','DO'],'🎲'],['ORSO',['OR','SO'],'🐻'],['PALLA',['PAL','LA'],'⚽'],['GATTO',['GAT','TO'],'🐱'],['BARCA',['BAR','CA'],'⛵'],['FIORE',['FIO','RE'],'🌸'],['TORTA',['TOR','TA'],'🎂'],['LATTE',['LAT','TE'],'🥛'],['PIZZA',['PIZ','ZA'],'🍕'],['VOLPE',['VOL','PE'],'🦊'],['CUORE',['CUO','RE'],'❤️'],['BANANA',['BA','NA','NA'],'🍌'],['LIMONE',['LI','MO','NE'],'🍋'],['GELATO',['GE','LA','TO'],'🍦'],['FARFALLA',['FAR','FAL','LA'],'🦋']];
const STICKERS=['🦄','🐶','🐱','🐼','🦁','🐯','🐸','🐙','🦋','🐞','🐬','🐢','🦒','🐘','🦊','🐰','🐨','🐧','🦉','🐝','🦖','🐳','🦜','🌈'];
const PRAISE=['Bravissima!','Evviva!','Che brava!','Fantastico!','Grande!','Perfetto!'];
const OBJ=['🍎','⭐','🐟','🎈','🚗','🦋','🍓','🐥','🌸','⚽'];
const VOW=['A','E','I','O','U'];
const ALL=LETTERS.map(l=>l[0]);
const VR={A:['Una gamba qua, una gamba là,','mi presento: son la A!'],E:['Di braccia ne ho tre,','mi presento: son la E!'],I:['Sempre in piedi sto, ogni notte e ogni dì,','mi presento: sono la I!'],O:['Ho sonno e niente fo, sbadiglio: oooh!','Mi presento: sono la O!'],U:['Mani in su, mani in su,','mi presento: sono la U!']};
const EXTRA=['Cerchiamo le vocali!','Impariamo le lettere nuove!','Ora scriviamo!','Ora cerchiamo le lettere!','Ora contiamo!','Mettiamo insieme le sillabe!','Ora leggiamo!','Ora un bel disegno da colorare!','Ancora!','Pronta per la missione di oggi?','Missione compiuta! Sei stata bravissima!','Per oggi abbiamo finito. A domani!'];
const L=ch=>S.lower?ch.toLowerCase():ch;
const COLORS=['#ff6b6b','#ffa94d','#51cf66','#339af0','#cc5de8','#20c997','#f06595','#fab005'];

/* ---------- audio ---------- */
let ac;
function unlock(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tone(f,t,d,type='sine',v=.18){if(!ac||S.mute)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;const s=ac.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d+.05)}
const sfx={ok(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.3))},no(){tone(300,0,.18,'triangle');tone(240,.13,.25,'triangle')},pop(){tone(760,0,.09)},big(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.1,.5))}};
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^it[-_]IT/i.test(v.lang))||vs.find(v=>v.lang.toLowerCase().startsWith('it'))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
let AUD={},curAudio=null;
fetch('audio/index.json').then(r=>r.json()).then(j=>AUD=j).catch(()=>{});
function stopAudio(){try{curAudio&&curAudio.pause();curAudio=null}catch(e){}try{speechSynthesis.cancel()}catch(e){}}
function say(t,o={}){return new Promise(res=>{if(S.mute)return res();
 const f=AUD[t.trim().toLowerCase()];
 if(f){try{if(o.cancel!==false)stopAudio();const a=new Audio('audio/'+f);curAudio=a;a.onended=res;a.onerror=res;a.play().catch(res);setTimeout(res,9000)}catch(e){res()}return}
 if(!('speechSynthesis' in window))return res();try{if(o.cancel!==false)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';if(voice)u.voice=voice;u.rate=o.rate||.8;u.pitch=1.15;u.onend=res;u.onerror=res;speechSynthesis.speak(u);setTimeout(res,9000)}catch(e){res()}})}
const praise=()=>say(pick(PRAISE));

/* ---------- effetti ---------- */
function confetti(){const f=document.createElement('div');f.className='confetti';for(let i=0;i<36;i++){const s=document.createElement('i');s.textContent=['⭐','🎉','✨','💖','🌈'][i%5];s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.5+'s';s.style.fontSize=20+Math.random()*26+'px';f.appendChild(s)}document.body.appendChild(f);setTimeout(()=>f.remove(),2800)}
function overlay(html,ms,onclose){const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="box">'+html+'</div>';document.body.appendChild(o);let closed=false;const close=()=>{if(closed)return;closed=true;o.remove();onclose&&onclose()};if(ms){setTimeout(close,ms);o.addEventListener('click',close)}return{o,close}}
function addStar(n=1){const before=Math.floor(S.stars/5);S.stars+=n;save();updHeader();const b=$('#bStars');b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse');
 if(Math.floor(S.stars/5)>before){const st=STICKERS[(Math.floor(S.stars/5)-1)%STICKERS.length];sfx.big();confetti();overlay('<div class="big2">'+st+'</div><div style="font-size:34px">Nuovo adesivo!</div>',3200);say('Hai vinto un nuovo adesivo!')}}
function updHeader(){$('#nStars').textContent=S.stars;$('#bMute').textContent=S.mute?'🔇':'🔊';$('#bCase').textContent=S.lower?'a':'A'}

/* ---------- router ---------- */
let tok=0,cleanup=null,cur='home';
const TITLES={home:'Impariamo con Pio',abc:'Alfabeto',trace:'Scrivi',find:'Trova la lettera',num:'Numeri',count:'Conta',syl:'Sillabe',read:'Leggi',album:'I miei adesivi',colora:'Colora',vocali:'Le vocali',mission:'Il mio percorso',learn:'Lettere nuove'};
const CASEABLE=['abc','trace','find','read'];
let lastArg;
function go(name,arg,keep){if(!keep&&MIS){MIS=null}updMbar();lastArg=arg;tok++;cleanup&&cleanup();cleanup=null;stopAudio();document.querySelectorAll('.overlay').forEach(o=>o.remove());cur=name;
 $('#title').textContent=TITLES[name];$('#bHome').classList.toggle('hide',name==='home');$('#bCase').classList.toggle('hide',!CASEABLE.includes(name));
 $('#main').innerHTML='';$('#main').scrollTop=0;SCREENS[name](arg,tok)}
function reroll(){go(cur,lastArg,true)}
$('#bHome').onclick=()=>{unlock();go('home')};

SCREENS.trace=(arg,t)=>{
 const C=MIS&&MIS.cfg;const isN=c=>/^\d$/.test(c);
 let mode=isN(arg||'')?'N':'L';
 const items=()=>C?C.trace:(mode==='L'?LETTERS.map(l=>l[0]):'0123456789'.split(''));
 let idx=C?0:Math.max(0,items().indexOf(arg||''));
 main().innerHTML=`${C?'':'<div class="row"><button class="pill" id="mL">Lettere</button><button class="pill" id="mN">Numeri</button></div>'}
 <div class="cv" id="cv"><canvas id="gh"></canvas><canvas id="ink"></canvas><div class="bar"><i id="pg"></i></div></div>
 <div class="strip" id="st"></div>
 <div class="row"><button class="pill" id="hear">🔊 Ascolta</button><button class="pill" id="clr">🗑️ Cancella</button><button class="pill" id="nxt">Avanti ➡️</button></div>`;
 const cv=$('#cv'),gh=$('#gh'),ink=$('#ink'),ictx=ink.getContext('2d'),gctx=gh.getContext('2d');
 const tmp=document.createElement('canvas'),tctx=tmp.getContext('2d',{willReadFrequently:true});
 let w,h,dpr,brush,maskD,allowD,drawing=false,last=null,hue=0,finished=false,glyph;
 const item=()=>items()[idx];
 const label=ch=>isN(ch)?ch:L(ch);
 function strip(){$('#st').innerHTML=items().map((c,k)=>`<button class="tile sm ${S.done[(isN(c)?'N':'L')+c]?'done':''}" data-k="${k}" style="--c:${COLORS[k%8]}">${label(c)}</button>`).join('');
  $('#st').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{idx=+b.dataset.k;setup()});
  const a=$('#st').children[idx];a&&a.scrollIntoView({inline:'center',block:'nearest'});
  if($('#mL')){$('#mL').classList.toggle('on',mode==='L');$('#mN').classList.toggle('on',mode==='N')}}
 function layout(ch){tctx.font=`900 100px ${FONT}`;let m=tctx.measureText(ch);
  const gh1=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent,gw=m.actualBoundingBoxLeft+m.actualBoundingBoxRight;
  const fs=100*Math.min(.78*h/gh1,.78*w/gw);tctx.font=`900 ${fs}px ${FONT}`;m=tctx.measureText(ch);
  const x=(w-(m.actualBoundingBoxLeft+m.actualBoundingBoxRight))/2+m.actualBoundingBoxLeft,y=(h-(m.actualBoundingBoxAscent+m.actualBoundingBoxDescent))/2+m.actualBoundingBoxAscent;
  return{fs,x,y,ch}}
 function setup(){
  w=cv.clientWidth;h=cv.clientHeight;if(!w||!h)return requestAnimationFrame(setup);dpr=Math.min(devicePixelRatio||1,2);
  for(const c of[gh,ink]){c.width=w*dpr;c.height=h*dpr}
  tmp.width=w;tmp.height=h;finished=false;$('#pg').style.width='0';
  const ch=label(item());glyph=layout(ch);brush=glyph.fs*.12;
  gctx.setTransform(dpr,0,0,dpr,0,0);gctx.clearRect(0,0,w,h);gctx.font=`900 ${glyph.fs}px ${FONT}`;gctx.textBaseline='alphabetic';gctx.textAlign='left';
  gctx.fillStyle='#eee8ff';gctx.fillText(ch,glyph.x,glyph.y);gctx.setLineDash([glyph.fs*.07,glyph.fs*.06]);gctx.lineWidth=4;gctx.strokeStyle='#8a6bff';gctx.strokeText(ch,glyph.x,glyph.y);
  ictx.setTransform(dpr,0,0,dpr,0,0);ictx.clearRect(0,0,w,h);
  tctx.clearRect(0,0,w,h);tctx.font=`900 ${glyph.fs}px ${FONT}`;tctx.textAlign='left';tctx.fillStyle='#000';tctx.fillText(ch,glyph.x,glyph.y);maskD=tctx.getImageData(0,0,w,h).data;
  {let A=0,P=0;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=(y*w+x)*4+3;if(maskD[i]>128){A++;if(maskD[i-4]<=128||maskD[i+4]<=128||maskD[i-w*4]<=128||maskD[i+w*4]<=128)P++}}
   brush=Math.min(glyph.fs*.22,Math.max(glyph.fs*.08,P?2.6*A/P:brush))}
  tctx.lineWidth=brush*1.3;tctx.lineJoin='round';tctx.strokeStyle='#000';tctx.strokeText(ch,glyph.x,glyph.y);allowD=tctx.getImageData(0,0,w,h).data;
  strip();
  if(setup.say!==false){say(!isN(item())?`Scrivi la ${LNAME[item()]}`:(item()==='0'?'Scrivi lo zero':`Scrivi il ${NUMW[+item()]}`))}}
 function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
 function seg(a,b){hue=(hue+4)%360;ictx.lineCap='round';ictx.lineJoin='round';ictx.lineWidth=brush;ictx.strokeStyle=`hsl(${hue} 85% 55%)`;ictx.beginPath();ictx.moveTo(a[0],a[1]);ictx.lineTo(b[0],b[1]);ictx.stroke()}
 function measure(){tctx.clearRect(0,0,w,h);tctx.drawImage(ink,0,0,w,h);const u=tctx.getImageData(0,0,w,h).data;let tot=0,cov=0,it=0,out=0;
  for(let y=0;y<h;y+=4)for(let x=0;x<w;x+=4){const i=(y*w+x)*4+3;const m=maskD[i]>128,k=u[i]>128;if(m){tot++;if(k)cov++}if(k){it++;if(allowD[i]<=128)out++}}
  return{cov:tot?cov/tot:0,out:it?out/it:0}}
 ink.onpointerdown=e=>{if(finished)return;e.preventDefault();ink.setPointerCapture(e.pointerId);drawing=true;last=pos(e);seg(last,[last[0]+.1,last[1]]);sfx.pop()};
 ink.onpointermove=e=>{if(!drawing)return;const p=pos(e);seg(last,p);last=p};
 const up=()=>{if(!drawing)return;drawing=false;const r=measure();$('#pg').style.width=Math.min(100,r.cov/.65*100)+'%';
  if(r.cov>=.65&&r.out<.5)win();else if(r.cov>=.65){say('Ripassa solo sulla lettera!')}};
 ink.onpointerup=up;ink.onpointercancel=up;
 function win(){if(finished)return;finished=true;S.done[(isN(item())?'N':'L')+item()]=true;save();sfx.ok();confetti();addStar();praise();strip();afterOk(()=>{if(t===tok)next()},2200)}
 function next(){idx=(idx+1)%items().length;setup()}
 if($('#mL')){$('#mL').onclick=()=>{mode='L';idx=0;setup()};$('#mN').onclick=()=>{mode='N';idx=0;setup()}}
 $('#hear').onclick=()=>say(!isN(item())?LNAME[item()]:NUMW[+item()]);
 $('#clr').onclick=()=>{setup.say=false;setup();setup.say=true};
 $('#nxt').onclick=next;
 const rs=()=>{setup.say=false;setup();setup.say=true};window.addEventListener('resize',rs);cleanup=()=>window.removeEventListener('resize',rs);
 requestAnimationFrame(setup);
};

function rhymeView(c,onDone){
 const lines=VR[c],w=LETTERS.find(l=>l[0]===c);
 const {o,close}=overlay(`<div class="rv"><div class="rl" style="color:${COLORS[VOW.indexOf(c)*2%8]}">${c}${c.toLowerCase()}</div><div class="rm">${w[2]}</div><div class="rt">${lines.map((l,i)=>`<div style="animation-delay:${i*1.6+.3}s">${l}</div>`).join('')}</div><button class="pill on" id="rvb">${onDone?'Avanti ▶':'✖ Chiudi'}</button></div>`,0,()=>{stopAudio();onDone&&onDone()});
 const sp=()=>say(lines.join(' '));$('.rl',o).onclick=sp;$('#rvb',o).onclick=close;sfx.big();setTimeout(sp,350)}

/* Vocali: trova le vocali sparse + filastrocche */
SCREENS.vocali=(arg,t)=>{
 const C=MIS&&MIS.cfg,seq=(arg&&arg.seq)||VOW,CONSON=ALL.filter(c=>!VOW.includes(c));let vi=0,tab='game';
 const tabs=()=>C?'':`<div class="row"><button class="pill ${tab==='game'?'on':''}" id="tg">🔎 Trova le vocali</button><button class="pill ${tab==='rh'?'on':''}" id="tr">🎵 Filastrocche</button></div>`;
 const bind=()=>{if(C)return;$('#tg').onclick=()=>{tab='game';game()};$('#tr').onclick=()=>{tab='rh';cards()}};
 function cards(){stopAudio();main().innerHTML=tabs()+`<div class="vrow">${VOW.map((c,i)=>`<button class="card" data-c="${c}" style="--c:${COLORS[i*2%8]}"><span class="e" style="font-family:${FONT}">${c}${c.toLowerCase()}</span><span style="font-size:clamp(40px,10vmin,90px);line-height:1">${LETTERS.find(l=>l[0]===c)[2]}</span></button>`).join('')}</div>`;
  bind();main().querySelectorAll('.card').forEach(b=>b.onclick=()=>rhymeView(b.dataset.c))}
 function game(){
  const v=seq[vi%seq.length];let found=0,fin=false;
  main().innerHTML=tabs()+`<div class="prompt"><span class="pio">🐥</span><span class="t">Trova la <b>${v}</b> &nbsp;<span id="sl">☆☆☆</span></span><button class="rb" id="sp">🔊</button></div><div class="scatter" id="sc"></div>`;bind();
  const cols=innerWidth>innerHeight?7:4,rows=innerWidth>innerHeight?3:6,total=cols*rows,oth=shuffle(VOW.filter(x=>x!==v));
  const list=[v,v,v,oth[0],oth[1],oth[2],...Array(total-6).fill(0).map(()=>pick(CONSON))],cells=shuffle([...Array(total).keys()]);
  $('#sc').innerHTML=list.map((ch,i)=>{const c=cells[i],cx=(c%cols+.5)/cols*100+(Math.random()-.5)*5,cy=(Math.floor(c/cols)+.5)/rows*100+(Math.random()-.5)*6;
   return `<button class="sc" data-c="${ch}" style="left:${cx}%;top:${cy}%;color:${COLORS[Math.random()*8|0]};--r:${Math.random()*44-22|0}deg;font-size:calc(var(--s)*${(.85+Math.random()*.3).toFixed(2)})">${Math.random()<.5?ch:ch.toLowerCase()}</button>`}).join('');
  $('#sc').querySelectorAll('.sc').forEach(b=>b.onclick=()=>{const ch=b.dataset.c;if(fin||b.classList.contains('ok'))return;
   if(ch===v){b.classList.add('ok');found++;$('#sl').textContent='⭐'.repeat(found)+'☆'.repeat(3-found);sfx.pop();
    if(found<3)say('Ancora!');else{fin=true;sfx.ok();confetti();addStar();setTimeout(()=>rhymeView(v,()=>{if(t===tok)afterOk(()=>{vi++;game()},0)}),700)}}
   else if(VOW.includes(ch)){rhymeView(ch)}
   else{sfx.no();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');say('Riprova!')}});
  const sp=()=>say(`Trova la ${LNAME[v]}`);$('#sp').onclick=sp;sp()}
 game();
};

/* Lettere nuove (tappa del percorso) */
SCREENS.learn=(arg,t)=>{
 const C=MIS&&MIS.cfg;if(!C)return go('abc');let i=0;
 const show=()=>{const c=C.focus[i],[,w,e]=LETTERS.find(l=>l[0]===c),last=i===C.focus.length-1;
  main().innerHTML=`<div class="detail"><div class="mid"><div class="big" style="color:${COLORS[ALL.indexOf(c)%8]};font-family:${FONT}">${c}${c.toLowerCase()}</div><div class="pic">${e}</div><div class="word"><b>${c}</b>${w.slice(1)}</div></div></div><div class="row"><button class="pill" id="sp">🔊 Ascolta</button><button class="pill on" id="nx">${last?'Fatto ✔':'Avanti ▶'}</button></div>`;
  const sp=()=>{sfx.pop();say(`${LNAME[c]}. ${LNAME[c]} come ${w}.`)};$('#sp').onclick=sp;main().querySelector('.pic').onclick=sp;main().querySelector('.big').onclick=sp;sp();
  $('#nx').onclick=()=>{sfx.pop();if(last){confetti();addStar();praise();setTimeout(()=>t===tok&&misStopDone(),1800)}else{i++;show()}}};
 show();
};

/* ---------- Percorso giornaliero ---------- */
const CONS_GROUPS={7:['M','P','T'],8:['L','S','N'],9:['C','D','B'],11:['F','V','R'],12:['G','Z','H'],13:['Q']};
const MAXN={7:5,8:6,9:7,10:7,11:8,12:9,13:10},DIGIT={7:'6',8:'7',9:'8',11:'9',12:'0'};
function dayPlan(d){
 let focus,known,title,trace,stops;const maxN=d<=5?[3,3,4,4,5][d-1]:(d===6?5:(MAXN[d]||10));
 const wk=k=>WORDS.filter(w=>[...w[0]].every(ch=>k.includes(ch))),rw=k=>WORDS.filter(w=>k.includes(w[0][0]));
 if(d<=5){const v=VOW[d-1];focus=[v];known=VOW.slice(0,d);if(known.length<3)known=VOW.slice(0,3);title='La vocale '+v;trace=[v,String(d)];
  stops=[{k:'vocali',need:1,arg:{seq:[v]}},{k:'trace',need:2},{k:'count',need:3},{k:'find',need:3},{k:'colora',need:1}]}
 else if(d===6){const vs=shuffle(VOW);focus=vs.slice(0,3);known=VOW;title='Ripasso delle vocali';trace=vs.slice(0,2);
  stops=[{k:'vocali',need:3,arg:{seq:focus}},{k:'find',need:3},{k:'trace',need:2},{k:'count',need:3},{k:'colora',need:1}]}
 else{
  const learned=[];for(const dd in CONS_GROUPS)if(+dd<=d)learned.push(...CONS_GROUPS[dd]);known=[...VOW,...learned];
  if(CONS_GROUPS[d]){focus=CONS_GROUPS[d];title='Le lettere '+focus.join(', ');trace=[...focus,...(DIGIT[d]?[DIGIT[d]]:[])]}
  else{focus=shuffle(known).slice(0,4);title='Giornata di ripasso';trace=focus.slice(0,3)}
  const sw=wk(known),hasSyl=sw.length>=3;
  stops=CONS_GROUPS[d]?[{k:'learn',need:1},{k:'find',need:3},{k:'trace',need:trace.length},{k:'count',need:3},{k:hasSyl?'syl':'read',need:3},{k:'colora',need:1}]
   :[{k:'find',need:3},{k:'read',need:3},{k:'trace',need:trace.length},{k:'count',need:3},{k:hasSyl?'syl':'find',need:3},{k:'colora',need:1}]}
 const t=stops.find(s=>s.k==='trace');if(t)t.need=trace.length;
 return{d,title,stops,cfg:{focus,known,maxN,trace,sylWords:wk(known),readWords:rw(known)}}}
const todayStr=(o=0)=>{const d=new Date(Date.now()+o*864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function startMission(day,replay){const plan=dayPlan(day);MIS={day,plan,cfg:plan.cfg,idx:0,n:0,need:plan.stops[0].need,replay};interlude()}
function interlude(){const s=MIS.plan.stops[MIS.idx],[ic,nm,ph]=STOPINFO[s.k];MIS.n=0;MIS.need=s.need;updMbar();const t0=tok;
 overlay(`<div class="big2">${ic}</div><div style="font-size:34px">${nm}</div>`,2600,()=>{if(MIS&&t0===tok)runStop()});say(ph)}
function runStop(){const s=MIS.plan.stops[MIS.idx];MIS.n=0;MIS.need=s.need;updMbar();go(s.k,s.arg,true)}
function misStopDone(){if(!MIS)return;MIS.idx++;if(MIS.idx>=MIS.plan.stops.length)finishMission();else interlude()}
function finishMission(){const m=MIS;MIS.idx=m.plan.stops.length;updMbar();
 if(!m.replay){S.plan.streak=S.plan.last===todayStr(-1)?S.plan.streak+1:1;S.plan.last=todayStr();S.plan.day=m.day+1}
 const before=Math.floor(S.stars/5);addStar(m.replay?1:3);const sticker=Math.floor(S.stars/5)>before;save();
 setTimeout(()=>{sfx.big();confetti();say('Missione compiuta! Sei stata bravissima!');
  overlay(`<div class="big2">🏆</div><div style="font-size:34px">Missione compiuta!</div><div style="font-size:26px;margin-top:6px">🔥 ${S.plan.streak} ${S.plan.streak===1?'giorno':'giorni'} di fila</div>`,6000,()=>go('mission'))},sticker?3400:200)}
SCREENS.mission=(arg,t)=>{
 const P=S.plan,done=P.last===todayStr(),day=done?P.day-1:P.day,plan=dayPlan(day);
 const lo=day>14?day-13:1,nodes=[];for(let d=lo;d<lo+14;d++)nodes.push(`<div class="nd ${d<P.day?'done':''} ${d===P.day&&!done?'cur':''}">${d<P.day?'⭐':d}</div>`);
 main().innerHTML=`<div class="prompt"><span class="pio">🐥</span><span class="t">${done?'Missione di oggi fatta! A domani 🎉':'Missione di oggi'}${P.streak>1?` &nbsp;🔥 ${P.streak}`:''}</span></div>
 <div class="path" id="pt">${nodes.join('')}</div>
 <div class="mcard"><h2>Giorno ${day}: ${plan.title}</h2><div class="stops">${plan.stops.map(s=>`<div class="stp"><b>${STOPINFO[s.k][0]}</b>${STOPINFO[s.k][1]}</div>`).join('')}</div>
 ${done?`<div class="row"><button class="pill" id="rp">🔄 Rigioca la missione</button><button class="pill" id="fr">🎮 Gioca libero</button></div>`:`<button class="pill bigbtn" id="go">Via! ▶</button>`}</div>`;
 const cur=$('.nd.cur');cur&&cur.scrollIntoView({inline:'center',block:'nearest'});
 if(done){$('#rp').onclick=()=>{sfx.pop();startMission(day,true)};$('#fr').onclick=()=>go('home');say('Per oggi abbiamo finito. A domani!')}
 else{$('#go').onclick=()=>{sfx.pop();startMission(day,false)};say('Pronta per la missione di oggi?')}
};

/* Album adesivi */
SCREENS.album=()=>{
 const got=Math.floor(S.stars/5),toNext=5-S.stars%5;
 main().innerHTML=`<div class="prompt"><span class="pio">🐥</span><span class="t">Hai ${S.stars} stelle ⭐ — ${got>=STICKERS.length?'Hai tutti gli adesivi!':'ancora '+toNext+' per un nuovo adesivo!'}</span></div>
 <div class="agrid" style="grid-template-columns:repeat(auto-fill,minmax(min(20vw,120px),1fr))">${STICKERS.map((s,i)=>`<div class="sticker ${i<got?'':'lock'}">${s}</div>`).join('')}</div>`;
};

/* ---------- avvio ---------- */
updHeader();go('home');
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
